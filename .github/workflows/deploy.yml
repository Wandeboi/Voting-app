name: deploy

on:
  push:
    branches: [main]

env:
  DOCKERHUB_USER: wandeboi

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Smoke test with Compose
        run: |
          docker compose up -d --build
          sleep 20
          curl --fail http://localhost:5000 || (docker compose logs && exit 1)
          docker compose down

  build-scan-push:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [vote, result, worker]
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build image (not pushed yet)
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          load: true
          tags: ${{ secrets.DOCKERHUB_WANDE }}/voting-${{ matrix.service }}:${{ github.sha }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_SKIP_VERSION_CHECK: true
        with:
          image-ref: ${{ secrets.DOCKERHUB_WANDE }}/voting-${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_WANDE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ secrets.DOCKERHUB_WANDE }}/voting-${{ matrix.service }}:${{ github.sha }}

  deploy:
    needs: build-scan-push
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name voting-app-cluster --region eu-north-1

      - name: Helm deploy
        run: |
          helm upgrade --install voting ./chart --wait --timeout 5m \
            --set apps.vote.image.tag=${{ github.sha }} \
            --set apps.result.image.tag=${{ github.sha }} \
            --set apps.worker.image.tag=${{ github.sha }}
