{{- range $name, $app := .Values.apps }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  replicas: {{ $app.replicas }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      enableServiceLinks: false
      containers:
        - name: {{ $name }}
          image: "{{ $app.image.repository }}:{{ $app.image.tag }}"
          {{- if $app.port }}
          ports:
            - containerPort: {{ $app.port }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ $app.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: {{ $app.runAsUser }}
            allowPrivilegeEscalation: false
---
{{- if $app.port }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  type: {{ $app.serviceType }}
  selector:
    app: {{ $name }}
  ports:
    - port: {{ $app.servicePort }}
      targetPort: {{ $app.port }}
---
{{- end }}
{{- end }}
